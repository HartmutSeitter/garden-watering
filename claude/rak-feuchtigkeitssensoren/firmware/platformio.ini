; RAK4631 WisBlock Soil Sensor
; Platform: nordicnrf52 (Adafruit BSP als Proxy für RAK4631)
; Framework: Arduino + RadioLib (kein RUI3, da RUI3 nicht PlatformIO-kompatibel)

[env:rak4631]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
lib_deps =
    4-20ma/ModbusMaster
    jgromes/RadioLib
monitor_speed = 115200
; Flashen via nrfjprog (J-Link / nRF Command Line Tools):
upload_protocol = nrfjprog
; Alternativ via UF2-Bootloader (doppelter Reset-Klick → USB-Drive erscheint):
; upload_protocol = nrfutil
build_flags =
    -DRADIOLIB_EXCLUDE_SX127X
    -DRADIOLIB_EXCLUDE_CC1101
    -DRADIOLIB_EXCLUDE_RF69
    -DRADIOLIB_EXCLUDE_SX1231
    -DRADIOLIB_EXCLUDE_CRC_MBED
